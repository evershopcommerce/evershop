extend type Order {
  customerUrl: String
  editUrl: String!
  createShipmentApi: String!
  cancelApi: String!
  """
  Whether this order can be captured right now: the payment method registered a
  `capture` handler AND the current payment status is flagged `isCapturable`
  (authorized, not yet captured). The admin capture button renders only when
  this is true.
  """
  canCapture: Boolean!
  """
  The one core capture endpoint — `POST /api/orders/:id/capture`. Present
  regardless of `canCapture`; the admin button is gated on `canCapture`.
  """
  captureApi: String!
  """
  Whether this order can be refunded right now: the payment method registered a
  `refund` handler AND the current payment status is flagged `isRefundable`. The
  admin refund button renders only when this is true.
  """
  canRefund: Boolean!
  """
  The one core refund endpoint — `POST /api/orders/:id/refunds`. Present
  regardless of `canRefund`; the admin button is gated on `canRefund`.
  """
  refundApi: String!
  shipment: Shipment
  """Items still to ship (shippable items with remaining qty > 0). Admin-only."""
  unshippedItems: [UnshippedOrderItem!]!
  metaData: JSON
  updateMetafieldsApi: String!
}

"""
An order item with remaining qty to ship. Filtered to shippable items only
— digital items (`noShippingRequired: true`) never appear here. Admin-only:
the storefront never surfaces "what's left to ship" — that's fulfillment
metadata.
"""
type UnshippedOrderItem {
  uuid: String!
  orderItemId: Int!
  productSku: String!
  productName: String!
  qtyOrdered: Int!
  qtyUnshipped: Int!
}

extend type Shipment {
  """Per-shipment delivered action — `POST /api/shipments/:uuid/markDelivered`."""
  markDeliveredApi: String!
  """Per-shipment cancel action — `POST /api/shipments/:uuid/cancel`."""
  cancelShipmentApi: String!
  """Per-shipment void-label action — `DELETE /api/shipments/:uuid/label`. Always present; the admin UI hides the button when the carrier doesn't implement voidLabel or when the shipment has no label_url."""
  voidShipmentLabelApi: String!
}

extend type Query {
  orders(filters: [FilterInput]): OrderCollection
}
