"""
The `Country` type represents a country. Regions below it come from
`Country.regions` / `Query.regions` (Address.graphql).
"""
type Country {
  name: String!
  code: String!
}

extend type Query {
  """
  Countries for a scope: ALL for the store's own address, SELL_TO for the
  address book and billing, SHIPPING for the shipping address. Replaces
  `countries(countries:)` and `allowedCountries`.
  """
  countries(scope: CountryScope = ALL): [Country!]!
}
